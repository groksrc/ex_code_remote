app = "ex-code-remote"
primary_region = "dfw"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# NOTE: Fly's HTTP proxy enforces a ~60s per-request cap that is not
# governed by http_options.idle_timeout (we tried setting it to 600 and
# requests were still killed at exactly 60s with 502). idle_timeout
# appears to control connection-level keepalive only, not single-request
# duration. Until Fly exposes a per-request timeout knob (or we move to
# streaming/SSE), the synchronous shell timeout is capped at 50s
# server-side in ExCodeRemote.MCP.Tools — see @max_shell_timeout there.

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/health"

[mounts]
  source = "ex_code_remote_data"
  destination = "/data"
