app = "ex-code-remote"
primary_region = "dfw"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# Bump Fly proxy idle_timeout from the 60s default to 600s so synchronous
# tool calls (run_shell_command etc.) can wait for slow agents/builds
# without the proxy closing the connection mid-flight. Anything genuinely
# longer than this should be handled via async tools.
[http_service.http_options]
  idle_timeout = 600

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/health"

[mounts]
  source = "ex_code_remote_data"
  destination = "/data"
